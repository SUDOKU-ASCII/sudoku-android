name: Android CI

permissions:
  contents: write

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 ndk;26.1.10909125

      - name: Build gomobile AAR (Sudoku core)
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          SUDOKU_REF: 56ce6f1aeea18aa69b9bc1d57557ed312b59e5f5  # v0.5.2.0
        run: |
          bash scripts/build_sudoku_aar.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/unit-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: /tmp/unit-tests.log
          if-no-files-found: ignore

      - name: Fail fast with unit test summary
        if: steps.unit_tests.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          err_line="$(grep -E '(^|[[:space:]])[^[:space:]]+\\.(kt|java):[0-9]+:[0-9]+' /tmp/unit-tests.log | head -n 1 || true)"
          if [ -z "$err_line" ]; then
            err_line="$(grep -E '^e: | error: |must be exhaustive|No parameter with name|Argument type mismatch|Overload resolution ambiguity|Not enough information to infer|Cannot infer a type|Unresolved reference|No value passed|Type mismatch|Too many arguments|None of the following functions|Cannot access|Expecting' /tmp/unit-tests.log | grep -vE '^> Task .* FAILED$' | head -n 1 || true)"
          fi
          if [ -z "$err_line" ]; then
            err_line="$(grep -E 'Execution failed for task|FAILURE: Build failed|> Task .* FAILED|Caused by:' /tmp/unit-tests.log | head -n 1 || true)"
          fi
          if [ -z "$err_line" ]; then
            err_line="$(tail -n 40 /tmp/unit-tests.log | tr '\n' ' ' | sed 's/[[:space:]]\\+/ /g' | cut -c1-1200)"
          fi
          echo "::error title=Run unit tests failed::$err_line"
          {
            echo "### Unit test failure (tail 120 lines)"
            echo '```'
            tail -n 120 /tmp/unit-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > github.keystore
            echo "Using persistent keystore from ANDROID_KEYSTORE_BASE64 secret."
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set; generating ephemeral keystore (signatures will differ between runs)." >&2
            keytool -genkeypair -v \
              -keystore github.keystore \
              -storepass github \
              -keypass github \
              -alias github \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GitHub CI, OU=CI, O=GitHub, L=Internet, S=Internet, C=US"
          fi

      - name: Build APK
        id: build_apk
        continue-on-error: true
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          set +e
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build-apk.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build APK log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log
          path: /tmp/build-apk.log
          if-no-files-found: ignore

      - name: Fail fast with build summary
        if: steps.build_apk.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          err_line="$(grep -E '(^|[[:space:]])[^[:space:]]+\\.(kt|java):[0-9]+:[0-9]+' /tmp/build-apk.log | head -n 1 || true)"
          if [ -z "$err_line" ]; then
            err_line="$(grep -E '^e: | error: |must be exhaustive|No parameter with name|Argument type mismatch|Overload resolution ambiguity|Not enough information to infer|Cannot infer a type|Unresolved reference|No value passed|Type mismatch|Too many arguments|None of the following functions|Cannot access|Expecting' /tmp/build-apk.log | grep -vE '^> Task .* FAILED$' | head -n 1 || true)"
          fi
          if [ -z "$err_line" ]; then
            err_line="$(grep -E 'Execution failed for task|FAILURE: Build failed|> Task .* FAILED|Caused by:' /tmp/build-apk.log | head -n 1 || true)"
          fi
          if [ -z "$err_line" ]; then
            err_line="$(tail -n 40 /tmp/build-apk.log | tr '\n' ' ' | sed 's/[[:space:]]\\+/ /g' | cut -c1-1200)"
          fi
          echo "::error title=Build APK failed::$err_line"
          {
            echo "### Build APK failure (tail 120 lines)"
            echo '```'
            tail -n 120 /tmp/build-apk.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Collect APKs
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-dev}"
          safe_ref="${ref//\//_}"
          apk_dir="app/build/outputs/apk/release"
          meta="$apk_dir/output-metadata.json"
          outdir="dist"
          mkdir -p "$outdir"

          echo "APK directory:"
          ls -la "$apk_dir" || true
          echo "APK files:"
          ls -la "$apk_dir"/*.apk || true
          echo "Output metadata:"
          if [ -f "$meta" ]; then
            cat "$meta"
          else
            echo "WARNING: $meta not found" >&2
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          apk_dir = Path("app/build/outputs/apk/release")
          outdir = Path("dist")
          outdir.mkdir(parents=True, exist_ok=True)

          safe_ref = (os.environ.get("GITHUB_REF_NAME") or "dev").replace("/", "_")

          meta = apk_dir / "output-metadata.json"
          apks = sorted(apk_dir.glob("*.apk"))
          if not apks:
              sys.exit(f"No APKs found under {apk_dir}")

          def pick_from_metadata() -> dict[str, Path] | None:
              if not meta.exists():
                  return None
              try:
                  data = json.loads(meta.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"WARNING: failed to parse {meta}: {e}", file=sys.stderr)
                  return None
              elements = data.get("elements") or []
              if not isinstance(elements, list):
                  return None

              def find_by_abi(value: str) -> Path | None:
                  for el in elements:
                      filters = el.get("filters") or []
                      for f in filters:
                          if f.get("filterType") == "ABI" and f.get("value") == value:
                              out = el.get("outputFile")
                              if out:
                                  p = apk_dir / out
                                  if p.exists():
                                      return p
                  return None

              arm64 = find_by_abi("arm64-v8a")
              armv7 = find_by_abi("armeabi-v7a")
              universal = find_by_abi("universal")
              if universal is None:
                  # Some AGP versions represent universal as "no filters".
                  for el in elements:
                      filters = el.get("filters") or []
                      out = el.get("outputFile")
                      if out and not filters:
                          p = apk_dir / out
                          if p.exists():
                              universal = p
                              break

              if arm64 and armv7 and universal:
                  return {"arm64-v8a": arm64, "armeabi-v7a": armv7, "universal": universal}
              return None

          def abis_in_apk(apk: Path) -> set[str]:
              abis: set[str] = set()
              with zipfile.ZipFile(apk) as z:
                  for name in z.namelist():
                      if not name.startswith("lib/") or not name.endswith(".so"):
                          continue
                      parts = name.split("/", 2)
                      if len(parts) >= 3:
                          abis.add(parts[1])
              return abis

          picked = pick_from_metadata()
          if picked is None:
              print("Metadata did not yield all outputs; falling back to inspecting APK contents.", file=sys.stderr)
              candidates: dict[str, list[Path]] = {"arm64-v8a": [], "armeabi-v7a": [], "universal": []}
              for apk in apks:
                  abis = abis_in_apk(apk)
                  if {"arm64-v8a", "armeabi-v7a"}.issubset(abis):
                      candidates["universal"].append(apk)
                  elif "arm64-v8a" in abis:
                      candidates["arm64-v8a"].append(apk)
                  elif "armeabi-v7a" in abis:
                      candidates["armeabi-v7a"].append(apk)

              def choose(xs: list[Path]) -> Path | None:
                  if not xs:
                      return None
                  xs_sorted = sorted(xs, key=lambda p: (("universal" not in p.name), -p.stat().st_size, p.name))
                  return xs_sorted[0]

              picked = {
                  "arm64-v8a": choose(candidates["arm64-v8a"]),
                  "armeabi-v7a": choose(candidates["armeabi-v7a"]),
                  "universal": choose(candidates["universal"]),
              }

          missing = [k for k, v in picked.items() if not v]
          if missing:
              print("ERROR: missing expected APK(s): " + ", ".join(missing), file=sys.stderr)
              print("Detected APKs:", file=sys.stderr)
              for apk in apks:
                  print(f"  - {apk.name} (abis={sorted(abis_in_apk(apk))})", file=sys.stderr)
              sys.exit(1)

          out_map = {
              "universal": outdir / f"sudodroid-{safe_ref}-universal.apk",
              "arm64-v8a": outdir / f"sudodroid-{safe_ref}-arm64-v8a.apk",
              "armeabi-v7a": outdir / f"sudodroid-{safe_ref}-armeabi-v7a.apk",
          }
          for k, src in picked.items():
              dst = out_map[k]
              assert src is not None
              shutil.copy2(src, dst)
              print(f"Collected {k}: {src} -> {dst}")
          PY

          echo "Collected:"
          ls -la "$outdir"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sudodroid-universal
          path: dist/*-universal.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sudodroid-arm64-v8a
          path: dist/*-arm64-v8a.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: sudodroid-armeabi-v7a
          path: dist/*-armeabi-v7a.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Sudodroid ${{ github.ref_name }}
          files: dist/*.apk
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') }}
          body: |
            ## Sudodroid v0.3.3

            A ground-up rebuild of the interface and the way the app talks to the Sudoku core, now on the official **Sudoku v0.5.2.0** and **hev-socks5-tunnel 2.19.1**.

            ### Highlights

            - **New interface.** Dark-first Material 3 in a warm charcoal palette: borderless tonal cards, large rounded corners, a floating navigation pill and a single big power button. It adapts to the screen: bottom bar on phones, navigation rail on foldables and small tablets, rail plus two-pane layouts on large tablets.
            - **Live speed and usage.** The app reads the core's external controller (`GET /traffic`) for the speed readout, session totals, the sparkline and the notification text. No patched core is needed, and the controller listens on loopback only, on a random port with a fresh secret on every start.
            - **Live routing.** Global / Direct / PAC switches instantly through `PATCH /configs` on the running core: no reconnect, no dropped connections (the new mode applies to new connections). The PAC list is always passed to the core, so switching to PAC at runtime has your rules ready.
            - **Activity tab.** Open connections with target, direct or proxied route and bytes each way, with per-connection and close-all actions. It polls only while visible.
            - **Settings tab.** PAC rules, the reverse TCP-over-WebSocket forwarder and app info in one place.
            - **Node latency is now a real RTT.** The probe times a full request (dial, Sudoku handshake, TLS, HTTP), which is about eight round trips, so the displayed figure is that time divided by 8. Numbers will look roughly eight times smaller than in earlier versions; do not compare them across versions.
            - **Lighter on the battery.** The traffic stream is open only while the app is on screen or the screen is on and closes a few seconds later; one shared stream feeds the UI and the notification; the notification updates only when its text changes; no infinite animations and no polling timers while the screen is off.

            ### Core and tunnel

            | Component | Version |
            | --- | --- |
            | Sudoku core | [v0.5.2.0](https://github.com/SUDOKU-ASCII/sudoku/releases/tag/v0.5.2.0) (`56ce6f1`), wire protocol unchanged and interoperable with v0.5.1 / v0.5.0 servers |
            | hev-socks5-tunnel | [2.19.1](https://github.com/heiher/hev-socks5-tunnel/releases/tag/2.19.1): lower memory use (small-packet compaction, idle heap release), faster TCP/UDP paths, UDP fixes |

            ### Also in this release (from the release candidates)

            - Fixed app UDP traffic (QUIC, voice calls) through the tunnel.
            - `sudoku://` short links now keep the node name, on import and on copy.
            - Fixed idle battery drain.
            - The app module no longer pins an NDK version; the NDK is needed only to build the Go AAR.

            ### Which file to download

            | File | For |
            | --- | --- |
            | `*-arm64-v8a.apk` | Almost every phone and tablet made since 2017 (recommended) |
            | `*-armeabi-v7a.apk` | Older 32-bit devices |
            | `*-universal.apk` | If you are unsure; larger, runs on both |

            Requires Android 10 (API 29) or newer. Your nodes and settings are kept when updating over a previous 0.3.x build signed with the same key.

            **Full changelog:** https://github.com/SUDOKU-ASCII/sudoku-android/compare/v0.3.2...v0.3.3

            ---

            ## 中文说明

            本版本从界面到内核对接方式整体重做,并升级到官方 **Sudoku v0.5.2.0** 与 **hev-socks5-tunnel 2.19.1**。

            - **全新界面**:深色优先的 Material 3 暖炭色调,无描边的色块卡片、大圆角、悬浮导航条和一个大电源按钮;手机用底部导航,折叠屏和小平板用侧边导航栏,大平板为导航栏加双栏布局。
            - **实时网速与用量**:直接读取内核 external controller 的 `/traffic`,用于网速、本次用量、折线图和通知栏,无需额外修改内核;控制器只监听本机回环,每次启动随机端口和随机密钥。
            - **实时切换路由**:全局 / 直连 / PAC 通过 `PATCH /configs` 即时生效,无需重连、不断开已有连接(对新连接生效)。
            - **Activity 页**:查看当前连接(目标、直连或代理、上下行流量),可关闭单个或全部连接,仅在页面可见时轮询。
            - **设置页**:PAC 规则、反向转发器与应用信息集中管理。
            - **节点延迟改为真实 RTT**:探测计时包含拨号、Sudoku 握手、TLS 与 HTTP,约等于 8 个往返,因此显示值为该耗时除以 8。数字会比旧版本小很多,不同版本之间不要直接对比。
            - **更省电**:流量推流仅在应用可见或亮屏时连接,息屏几秒后断开;界面与通知共用同一路推流;通知仅在文字变化时刷新;无无限动画,息屏后无轮询定时器。
            - **内核与隧道**:Sudoku v0.5.2.0(协议不变,与 v0.5.1 / v0.5.0 服务端互通);hev-socks5-tunnel 2.19.1(更低内存占用、更快的 TCP/UDP 路径与 UDP 修复)。
            - **沿用自候选版的修复**:修复应用 UDP(QUIC、语音通话)、`sudoku://` 短链接保留节点名、修复空闲耗电。
            - **下载哪个**:绝大多数 2017 年后的设备选 `arm64-v8a`;老旧 32 位设备选 `armeabi-v7a`;不确定就选 `universal`。需要 Android 10 及以上;使用相同签名覆盖安装时会保留节点与设置。
